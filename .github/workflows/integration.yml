name: Integration

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Spark, Iceberg, and benchmark integration
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.0"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev --group bench --no-group airflow --python 3.14.0

      - name: Run Spark integration suites
        run: >-
          uv run --locked --no-sync pytest -m integration
          --ignore=tests/test_iceberg_optimize.py
          --ignore=tests/test_bench_e2e.py
          --ignore=tests/test_bench_e2e_tagged.py

      - name: Run Iceberg optimization in a fresh Spark process
        run: uv run --locked --no-sync pytest -m integration tests/test_iceberg_optimize.py -x -q

      - name: Run mandatory offline data-path benchmark qualification
        run: >-
          uv run --locked --no-sync pytest -m integration
          tests/test_bench_e2e.py tests/test_bench_e2e_tagged.py -x -q

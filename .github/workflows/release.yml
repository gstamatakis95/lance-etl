name: Release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  quality:
    name: Required Python and Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-bookworm@sha256:6374b678afc82d28b31a7058e50dbfd665fa2199ab192a768fc5eedbc3abfa89
        env:
          POSTGRES_DB: lance_etl
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
      redis:
        image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
        ports:
          - 6379:6379
    env:
      LANCE_ETL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lance_etl
      SEARCH_API_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.0"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17.0.19+10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.8"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "33.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --locked --group dev --group bench --no-group airflow --python 3.14.0
      - run: uv run --locked --no-sync ruff format --check src/ tests/ airflow/ bench/
      - run: uv run --locked --no-sync ruff check src/ tests/ airflow/ bench/
      - run: uv run --locked --no-sync pytest -m "not integration"
      - working-directory: rust/search-api
        run: cargo fmt --check && cargo clippy --locked -- -D warnings && cargo test --locked

  integration:
    name: Required integration gates
    uses: ./.github/workflows/integration.yml

  image:
    name: Build, scan, attest, and publish
    needs:
      - quality
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: search-api
            dockerfile: containers/search-api.Dockerfile
            image: lance-etl-search
          - component: reconciler
            dockerfile: containers/reconciler.Dockerfile
            image: lance-etl-reconciler
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: GIT_REVISION=${{ github.sha }}
          load: true
          push: false
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.image }}:release-candidate-${{ github.sha }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:release-candidate-${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - id: publish
        name: Push scanned candidate and record digest
        run: |
          candidate='${{ matrix.image }}:release-candidate-${{ github.sha }}'
          remote="${IMAGE_NAME}:git-${GITHUB_SHA}"
          docker tag "$candidate" "$remote"
          push_output=$(docker push "$remote")
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | awk '$1 == "digest:" {print $2}' | tail -n 1)
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable release identity
        run: |
          labels=$(docker inspect --format '{{json .Config.Labels}}' '${{ matrix.image }}:release-candidate-${{ github.sha }}')
          jq -n \
            --arg component '${{ matrix.component }}' \
            --arg git_revision "$GITHUB_SHA" \
            --arg image "${IMAGE_NAME}@${{ steps.publish.outputs.digest }}" \
            --argjson runtime_labels "$labels" \
            '{component:$component,git_revision:$git_revision,image:$image,runtime_labels:$runtime_labels}' \
            > '${{ matrix.component }}-release-identity.json'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.component }}-release-${{ github.sha }}
          path: |
            ${{ matrix.component }}-release-identity.json
            ${{ matrix.component }}.spdx.json
          if-no-files-found: error
          retention-days: 90

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        run: pip install uv

      - name: Install package with dev and bench dependency groups
        run: uv pip install --system -e . --group dev --group bench

      - name: ruff format check
        run: uvx ruff format --check src/ tests/ airflow/ bench/

      - name: ruff lint
        run: uvx ruff check src/ tests/ airflow/ bench/

      - name: pytest (non-integration)
        run: pytest -m "not integration"

  airflow:
    name: Airflow DAG-parse tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        run: pip install uv

      - name: Install package with dev and airflow dependency groups
        run: uv pip install --system -e . --group dev --group airflow

      - name: pytest airflow DAG-parse tests
        run: pytest tests/test_airflow_dags.py -v

  rust:
    name: Rust search-api
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust/search-api
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/search-api

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-bookworm@sha256:6374b678afc82d28b31a7058e50dbfd665fa2199ab192a768fc5eedbc3abfa89
        env:
          POSTGRES_DB: lance_etl
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d lance_etl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      LANCE_ETL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/lance_etl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.0"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize locked Python environment
        run: uv sync --locked --group dev --group bench --no-group airflow --python 3.14.0

      - name: Check Python formatting
        run: uv run --locked --no-sync ruff format --check src/ tests/ airflow/ bench/

      - name: Lint Python
        run: uv run --locked --no-sync ruff check src/ tests/ airflow/ bench/

      - name: Run non-integration tests
        run: uv run --locked --no-sync pytest -m "not integration"

  airflow:
    name: Airflow DAG parse tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.0"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.8"
          enable-cache: true

      - name: Synchronize locked Airflow environment
        run: uv sync --locked --group dev --group airflow --no-group bench --python 3.14.0

      - name: Parse every production DAG
        run: uv run --locked --no-sync pytest tests/test_airflow_dags.py -v

  rust:
    name: Rust search API
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
    env:
      SEARCH_API_TEST_REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: rust/search-api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "33.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: rust/search-api

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked -- -D warnings

      - name: Test Rust
        run: cargo test --locked

      - name: Build release server
        run: cargo build --release --locked

  integration:
    name: Required integration and benchmark gates
    uses: ./.github/workflows/integration.yml

  container:
    name: Container build and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: search-api
            dockerfile: containers/search-api.Dockerfile
            image: lance-etl-search:ci
          - component: reconciler
            dockerfile: containers/reconciler.Dockerfile
            image: lance-etl-reconciler:ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: GIT_REVISION=${{ github.sha }}
          load: true
          push: false
          tags: ${{ matrix.image }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Validate Kubernetes release manifests
        if: matrix.component == 'search-api'
        run: >-
          docker run --rm
          --volume "$PWD:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0
          -strict -summary -kubernetes-version 1.32.0
          /work/deploy/search-api/statefulset.yaml
          /work/deploy/search-api/headless-service.yaml
          /work/deploy/search-api/service.yaml
          /work/deploy/search-api/service-account.yaml
          /work/deploy/search-api/pod-disruption-budget.yaml
          /work/deploy/search-api/network-policy.yaml
          /work/deploy/search-api/canary.yaml
          /work/deploy/reconciler/driver-pod-template.yaml
          /work/deploy/reconciler/executor-pod-template.yaml
          /work/deploy/reconciler/rbac.yaml
          /work/deploy/control-plane/migration-job.yaml

      - name: Validate GitHub Actions workflows
        if: matrix.component == 'search-api'
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

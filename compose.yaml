services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lance_etl
      POSTGRES_PASSWORD: lance_etl
      POSTGRES_USER: lance_etl
    ports:
      - "${LANCE_ETL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lance_etl -d lance_etl"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - lance_etl_postgres:/var/lib/postgresql/data

volumes:
  lance_etl_postgres:

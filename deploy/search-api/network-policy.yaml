apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lance-etl-search
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lance-etl-search
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              lance-etl.openai.com/search-client: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: reconciler
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: UDP
          port: 8125
        - protocol: TCP
          port: 4317

apiVersion: v1
kind: ServiceAccount
metadata:
  name: lance-etl-reconciler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lance-etl-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lance-etl-reconciler-driver
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lance-etl-reconciler-driver
subjects:
  - kind: ServiceAccount
    name: lance-etl-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lance-etl-reconciler-driver

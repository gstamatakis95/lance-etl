[package]
name = "search-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Lightweight gRPC search service serving per-org Lance datasets (vector, FTS, hybrid RRF)"

[workspace]

[lib]
name = "search_api"
path = "src/lib.rs"

[[bin]]
name = "search-api"
path = "src/main.rs"

[dependencies]
lance = "8.0.0"
lance-core = "8.0.0"
lance-index = "8.0.0"
lance-io = "8.0.0"
lance-linalg = "8.0.0"
arrow = { version = "58.0.0", features = ["json"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
async-trait = "0.1"
blake3 = "1"
bytes = "1"
cadence = "1.8"
chrono = "0.4"
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
object_store = "0.13.2"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-tracing-opentelemetry = "0.38"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = "fat"
codegen-units = 1

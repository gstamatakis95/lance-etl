[package]
name = "search-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
description = "Lightweight gRPC search service serving per-org Lance datasets (vector, FTS, hybrid RRF)"

[workspace]

[lib]
name = "search_api"
path = "src/lib.rs"

[[bin]]
name = "search-api"
path = "src/main.rs"

[dependencies]
lance = { path = "../../../lance/rust/lance" }
lance-core = { path = "../../../lance/rust/lance-core" }
lance-index = { path = "../../../lance/rust/lance-index" }
lance-io = { path = "../../../lance/rust/lance-io" }
lance-linalg = { path = "../../../lance/rust/lance-linalg" }
arrow = { version = "58.0.0", features = ["json"] }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
moka = { version = "0.12", features = ["future"] }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

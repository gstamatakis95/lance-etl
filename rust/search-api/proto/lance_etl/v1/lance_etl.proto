syntax = "proto3";

package lance_etl.v1;

// Production search over one catalog-resolved logical target.
service SearchService {
  // Nearest-neighbor search.
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  // Full-text search.
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse);
  // Vector and full-text search fused by a code-owned product mode.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);
}

// Logical target resolved server-side through the serving catalog.
message DatasetTarget {
  // Organization identifier.
  string org_id = 1;
  // Tenant identifier.
  string tenant_id = 2;
  // Namespace identifier.
  string namespace = 3;
}

// Comparison operator for a typed predicate.
enum CompareOp {
  // Invalid value.
  COMPARE_OP_UNSPECIFIED = 0;
  // Equal.
  COMPARE_OP_EQ = 1;
  // Not equal.
  COMPARE_OP_NE = 2;
  // Less than.
  COMPARE_OP_LT = 3;
  // Less than or equal.
  COMPARE_OP_LE = 4;
  // Greater than.
  COMPARE_OP_GT = 5;
  // Greater than or equal.
  COMPARE_OP_GE = 6;
}

// Typed literal transported without expression parsing.
message LiteralValue {
  // Exactly one literal kind.
  oneof kind {
    // Boolean literal.
    bool bool_value = 1;
    // Signed integer literal.
    int64 int64_value = 2;
    // Floating-point literal.
    double double_value = 3;
    // String literal.
    string string_value = 4;
  }
}

// Typed predicate AST.
message Filter {
  // Exactly one predicate kind.
  oneof predicate {
    // Column comparison.
    Comparison comparison = 1;
    // Membership predicate.
    InList in_list = 2;
    // Null predicate.
    IsNull is_null = 3;
    // Non-null predicate.
    IsNotNull is_not_null = 4;
    // Inclusive range predicate.
    Between between = 5;
    // Logical conjunction.
    FilterList and = 6;
    // Logical disjunction.
    FilterList or = 7;
    // Logical negation.
    Filter not = 8;
  }
}

// Column comparison.
message Comparison {
  // Column name.
  string column = 1;
  // Operator.
  CompareOp op = 2;
  // Literal.
  LiteralValue value = 3;
}

// Membership predicate.
message InList {
  // Column name.
  string column = 1;
  // Candidate values.
  repeated LiteralValue values = 2;
  // Negates membership when true.
  bool negated = 3;
}

// Null predicate.
message IsNull {
  // Column name.
  string column = 1;
}

// Non-null predicate.
message IsNotNull {
  // Column name.
  string column = 1;
}

// Inclusive range predicate.
message Between {
  // Column name.
  string column = 1;
  // Inclusive lower bound.
  LiteralValue low = 2;
  // Inclusive upper bound.
  LiteralValue high = 3;
}

// Non-empty logical child list.
message FilterList {
  // Child predicates.
  repeated Filter filters = 1;
}

// Half-open event-time window in epoch milliseconds.
message TimeRange {
  // Inclusive lower bound.
  optional int64 start_ms = 1;
  // Exclusive upper bound.
  optional int64 end_ms = 2;
}

// Vector query semantics. Execution policy comes from the target profile.
message VectorQuery {
  // Query vector.
  repeated float vector = 1;
  reserved 2 to 16;
  reserved "k", "column", "distance_type", "nprobes", "minimum_nprobes", "maximum_nprobes";
  reserved "refine_factor", "ef", "fast_search", "bypass_vector_index", "filter", "filter_mode";
  reserved "projection", "with_row_id", "offset";
}

// How match-query terms combine.
enum TextOperator {
  // Defaults to OR.
  TEXT_OPERATOR_UNSPECIFIED = 0;
  // At least one term matches.
  TEXT_OPERATOR_OR = 1;
  // Every term matches.
  TEXT_OPERATOR_AND = 2;
}

// Full-text query tree.
message FtsQuery {
  // Exactly one node.
  oneof query {
    // Match terms.
    MatchQuery match = 1;
    // Match a phrase.
    PhraseQuery phrase = 2;
    // Reweight a negative query.
    BoostQuery boost = 3;
    // Match terms across columns.
    MultiMatchQuery multi_match = 4;
    // Combine query nodes.
    BooleanQuery boolean = 5;
  }
}

// Terms query.
message MatchQuery {
  // Terms.
  string terms = 1;
  // Optional allowlisted column.
  optional string column = 2;
  // Semantic score multiplier.
  optional float boost = 3;
  // Term operator.
  TextOperator operator = 4;
  // Semantic fuzzy-match selection.
  oneof fuzziness {
    // Automatic edit distance.
    bool auto_fuzziness = 5;
    // Maximum edit distance.
    uint32 max_distance = 6;
  }
  reserved 7;
  reserved "max_expansions";
  // Unchanged leading characters for fuzzy semantics.
  optional uint32 prefix_length = 8;
}

// Exact phrase query.
message PhraseQuery {
  // Terms.
  string terms = 1;
  // Optional allowlisted column.
  optional string column = 2;
  // Allowed intervening positions.
  uint32 slop = 3;
}

// Positive and down-weighted negative query.
message BoostQuery {
  // Positive query.
  FtsQuery positive = 1;
  // Negative query.
  FtsQuery negative = 2;
  // Semantic negative multiplier.
  optional float negative_boost = 3;
}

// Multi-column terms query.
message MultiMatchQuery {
  // Terms.
  string terms = 1;
  // Allowlisted columns.
  repeated string columns = 2;
  // Semantic per-column boosts.
  repeated float boosts = 3;
  // Term operator.
  TextOperator operator = 4;
}

// Boolean query.
message BooleanQuery {
  // Optional clauses.
  repeated FtsQuery should = 1;
  // Required clauses.
  repeated FtsQuery must = 2;
  // Excluding clauses.
  repeated FtsQuery must_not = 3;
}

// Text query semantics. Execution policy comes from the target profile.
message TextQuery {
  // Query input.
  oneof input {
    // Simple OR-match terms.
    string simple = 1;
    // Full typed query tree.
    FtsQuery fts = 2;
  }
  // Allowlisted search columns.
  repeated string columns = 3;
  reserved 4 to 11;
  reserved "k", "wand_factor", "filter", "filter_mode", "projection", "with_row_id", "offset", "fast_search";
}

// Small product-level hybrid strategy selector.
enum HybridFusionMode {
  // Use the target profile default.
  HYBRID_FUSION_MODE_UNSPECIFIED = 0;
  // Balance semantic and lexical relevance.
  HYBRID_FUSION_MODE_BALANCED = 1;
  // Prefer semantic relevance.
  HYBRID_FUSION_MODE_SEMANTIC_PRIORITY = 2;
  // Prefer lexical relevance.
  HYBRID_FUSION_MODE_LEXICAL_PRIORITY = 3;
}

// Closed warning codes for bounded partial responses.
enum SearchWarning {
  // Invalid value.
  SEARCH_WARNING_UNSPECIFIED = 0;
  // Deduplication left fewer than k logical results.
  SEARCH_WARNING_RESULTS_UNDERFILLED = 1;
  // The vector leg was unavailable.
  SEARCH_WARNING_VECTOR_LEG_UNAVAILABLE = 2;
  // The text leg was unavailable.
  SEARCH_WARNING_TEXT_LEG_UNAVAILABLE = 3;
}

// Explicit null projection value.
message NullProjectionValue {}

// Closed typed scalar projection value.
message ProjectionValue {
  // Exactly one scalar kind.
  oneof kind {
    // Null value.
    NullProjectionValue null_value = 1;
    // Boolean value.
    bool bool_value = 2;
    // Signed integer value.
    sint64 int64_value = 3;
    // Unsigned integer value.
    uint64 uint64_value = 4;
    // Floating-point value.
    double double_value = 5;
    // UTF-8 string value.
    string string_value = 6;
  }
}

// One named projected scalar.
message ProjectedField {
  // Column name.
  string name = 1;
  // Typed value.
  ProjectionValue value = 2;
}

// Vector search request.
message VectorSearchRequest {
  // Logical target.
  DatasetTarget target = 1;
  // Query semantics.
  VectorQuery query = 2;
  reserved 3, 5, 6;
  reserved "rerank", "version", "tag";
  // Bounded result count.
  uint32 k = 7;
  // Typed predicate.
  Filter filter = 8;
  // Allowlisted scalar projection.
  repeated string projection = 9;
  // Event-time window.
  TimeRange time_range = 4;
}

// Vector search response.
message VectorSearchResponse {
  // Results ordered nearest-first.
  repeated VectorSearchResult results = 1;
  // Exact catalog-served Lance version.
  uint64 served_version = 2;
  // True only when warnings describe a permitted degraded result.
  bool partial = 3;
  // Bounded closed warning codes.
  repeated SearchWarning warnings = 4;
}

// One vector result.
message VectorSearchResult {
  reserved 1;
  reserved "row";
  // Vector distance.
  float distance = 2;
  // Stable logical identifier.
  string record_id = 3;
  // Requested scalar projection.
  repeated ProjectedField projection = 4;
}

// Text search request.
message TextSearchRequest {
  // Logical target.
  DatasetTarget target = 1;
  // Query semantics.
  TextQuery query = 2;
  reserved 3, 5, 6;
  reserved "rerank", "version", "tag";
  // Bounded result count.
  uint32 k = 7;
  // Typed predicate.
  Filter filter = 8;
  // Allowlisted scalar projection.
  repeated string projection = 9;
  // Event-time window.
  TimeRange time_range = 4;
}

// Text search response.
message TextSearchResponse {
  // Results ordered best-first.
  repeated TextSearchResult results = 1;
  // Exact catalog-served Lance version.
  uint64 served_version = 2;
  // True only when warnings describe a permitted degraded result.
  bool partial = 3;
  // Bounded closed warning codes.
  repeated SearchWarning warnings = 4;
}

// One text result.
message TextSearchResult {
  reserved 1;
  reserved "row";
  // BM25 score.
  float score = 2;
  // Stable logical identifier.
  string record_id = 3;
  // Requested scalar projection.
  repeated ProjectedField projection = 4;
}

// Hybrid search request.
message HybridSearchRequest {
  // Logical target.
  DatasetTarget target = 1;
  // Vector query semantics.
  VectorQuery vector = 2;
  // Text query semantics.
  TextQuery text = 3;
  // Bounded fused result count.
  uint32 k = 4;
  reserved 5, 6, 9, 10, 11;
  reserved "fusion", "rerank", "filter_mode", "version", "tag";
  // Event-time window shared by both legs.
  TimeRange time_range = 7;
  // Typed predicate shared by both legs.
  Filter filter = 8;
  // Product fusion mode.
  HybridFusionMode fusion_mode = 12;
  // Allowlisted scalar projection shared by both legs.
  repeated string projection = 13;
}

// Hybrid search response.
message HybridSearchResponse {
  // Fused results ordered best-first.
  repeated HybridSearchResult results = 1;
  // Exact catalog-served Lance version.
  uint64 served_version = 2;
  // True only when warnings describe a permitted degraded result.
  bool partial = 3;
  // Bounded closed warning codes.
  repeated SearchWarning warnings = 4;
}

// One hybrid result.
message HybridSearchResult {
  reserved 1;
  reserved "row";
  // Fused score.
  double fused_score = 2;
  // Stable logical identifier.
  string record_id = 3;
  // Requested scalar projection.
  repeated ProjectedField projection = 4;
}

syntax = "proto3";

package lance_etl.search.v1;

import "google/protobuf/struct.proto";

// Search over per-organization Lance datasets: nearest-neighbor, full-text, and hybrid fusion.
service SearchService {
  // Nearest-neighbor search on a vector column of the org dataset.
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  // Full-text search via the INVERTED index.
  rpc TextSearch(TextSearchRequest) returns (TextSearchResponse);
  // Runs a vector leg and a text leg, then fuses the ranked lists with the configured strategy.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);
}

// Distance metric for nearest-neighbor search.
enum DistanceType {
  // Defaults to the metric the vector index was built with (L2 for flat search).
  DISTANCE_TYPE_UNSPECIFIED = 0;
  // Euclidean (L2) distance.
  DISTANCE_TYPE_L2 = 1;
  // Cosine distance.
  DISTANCE_TYPE_COSINE = 2;
  // Negative dot-product distance.
  DISTANCE_TYPE_DOT = 3;
  // Hamming distance (binary vectors).
  DISTANCE_TYPE_HAMMING = 4;
}

// Whether a filter runs before or after the index search.
enum FilterMode {
  // Defaults to FILTER_MODE_PREFILTER.
  FILTER_MODE_UNSPECIFIED = 0;
  // Apply the filter before the index search; exact but potentially more expensive.
  FILTER_MODE_PREFILTER = 1;
  // Apply the filter to the index results; may return fewer rows than requested.
  FILTER_MODE_POSTFILTER = 2;
}

// Comparison operator for a column-vs-literal predicate.
enum CompareOp {
  // Invalid; requests using it are rejected.
  COMPARE_OP_UNSPECIFIED = 0;
  // Equal.
  COMPARE_OP_EQ = 1;
  // Not equal.
  COMPARE_OP_NE = 2;
  // Less than.
  COMPARE_OP_LT = 3;
  // Less than or equal.
  COMPARE_OP_LE = 4;
  // Greater than.
  COMPARE_OP_GT = 5;
  // Greater than or equal.
  COMPARE_OP_GE = 6;
}

// A typed literal used in filter predicates.
message LiteralValue {
  // Exactly one literal kind.
  oneof kind {
    // Boolean literal.
    bool bool_value = 1;
    // 64-bit integer literal; coerced to the column type by the engine.
    int64 int64_value = 2;
    // Double literal; coerced to the column type by the engine.
    double double_value = 3;
    // String literal; transported verbatim, never interpreted as an expression.
    string string_value = 4;
  }
}

// Typed predicate AST evaluated server-side; clients can never inject expression text.
message Filter {
  // Exactly one predicate kind.
  oneof predicate {
    // column <op> literal.
    Comparison comparison = 1;
    // column IN (...) or NOT IN (...).
    InList in_list = 2;
    // column IS NULL.
    IsNull is_null = 3;
    // column IS NOT NULL.
    IsNotNull is_not_null = 4;
    // low <= column <= high.
    Between between = 5;
    // All child filters must hold.
    FilterList and = 6;
    // At least one child filter must hold.
    FilterList or = 7;
    // The child filter must not hold.
    Filter not = 8;
  }
}

// A column-vs-literal comparison predicate.
message Comparison {
  // Column name; must exist in the dataset schema.
  string column = 1;
  // Comparison operator.
  CompareOp op = 2;
  // Right-hand literal.
  LiteralValue value = 3;
}

// Membership predicate: column IN (values) or, when negated, column NOT IN (values).
message InList {
  // Column name; must exist in the dataset schema.
  string column = 1;
  // Candidate values; must be non-empty.
  repeated LiteralValue values = 2;
  // When true, the predicate is NOT IN.
  bool negated = 3;
}

// Null-check predicate: column IS NULL.
message IsNull {
  // Column name; must exist in the dataset schema.
  string column = 1;
}

// Null-check predicate: column IS NOT NULL.
message IsNotNull {
  // Column name; must exist in the dataset schema.
  string column = 1;
}

// Range predicate: low <= column <= high.
message Between {
  // Column name; must exist in the dataset schema.
  string column = 1;
  // Inclusive lower bound.
  LiteralValue low = 2;
  // Inclusive upper bound.
  LiteralValue high = 3;
}

// A non-empty list of child filters combined by the enclosing AND/OR.
message FilterList {
  // Child predicates; must be non-empty.
  repeated Filter filters = 1;
}

// Parameters for one nearest-neighbor query, reused by VectorSearch and the hybrid vector leg.
message VectorQuery {
  // Query vector; its length must match the vector column dimension.
  repeated float vector = 1;
  // Number of nearest neighbors to return. In a hybrid query, 0 inherits the fused k.
  uint32 k = 2;
  // Vector column name; defaults to the first fixed-size-list column in the schema.
  optional string column = 3;
  // Distance metric override.
  DistanceType distance_type = 4;
  // Sets minimum and maximum probed partitions to the same value (IVF indexes).
  optional uint32 nprobes = 5;
  // Minimum number of index partitions to probe; ignored when nprobes is set.
  optional uint32 minimum_nprobes = 6;
  // Maximum number of index partitions to probe; only effective with a prefilter.
  optional uint32 maximum_nprobes = 7;
  // Read refine_factor * k candidates and re-rank them with the raw vectors.
  optional uint32 refine_factor = 8;
  // HNSW ef-search parameter.
  optional uint32 ef = 9;
  // Search only indexed data (weak consistency, lower latency).
  bool fast_search = 10;
  // Skip the vector index and do a flat (exact) scan.
  bool bypass_vector_index = 11;
  // Optional typed predicate applied to the search.
  Filter filter = 12;
  // Whether the filter runs before or after the index search.
  FilterMode filter_mode = 13;
  // Columns to return; defaults to all non-vector columns.
  repeated string projection = 14;
  // Include the stable `_rowid` meta column in each returned row.
  bool with_row_id = 15;
  // Number of leading hits to skip.
  optional uint64 offset = 16;
}

// How match-query terms combine.
enum TextOperator {
  // Defaults to TEXT_OPERATOR_OR.
  TEXT_OPERATOR_UNSPECIFIED = 0;
  // At least one term must match.
  TEXT_OPERATOR_OR = 1;
  // All terms must match.
  TEXT_OPERATOR_AND = 2;
}

// Full-text query node tree mirroring the Lance FTS query model.
message FtsQuery {
  // Exactly one query node kind.
  oneof query {
    // Terms matching with OR/AND semantics and optional fuzziness.
    MatchQuery match = 1;
    // Exact phrase matching; requires an index built with positions.
    PhraseQuery phrase = 2;
    // Re-weights hits of a negative query against a positive query.
    BoostQuery boost = 3;
    // The same terms matched over several columns with per-column boosts.
    MultiMatchQuery multi_match = 4;
    // Boolean combination of sub-queries (should / must / must_not).
    BooleanQuery boolean = 5;
  }
}

// Terms query against one column.
message MatchQuery {
  // Query terms, tokenized by the index tokenizer.
  string terms = 1;
  // Column to search; may be omitted when the enclosing TextQuery sets columns.
  optional string column = 2;
  // Score multiplier for this query (default 1.0).
  optional float boost = 3;
  // How terms combine: OR (default, any term matches) or AND (all terms must match).
  TextOperator operator = 4;
  // Fuzzy matching; absent means exact term matching.
  oneof fuzziness {
    // Pick the edit distance automatically from each term length.
    bool auto_fuzziness = 5;
    // Maximum edit distance for fuzzy matching.
    uint32 max_distance = 6;
  }
  // Maximum number of expanded terms for fuzzy matching (default 50).
  optional uint32 max_expansions = 7;
  // Number of beginning characters kept unchanged for fuzzy matching (default 0).
  optional uint32 prefix_length = 8;
}

// Exact phrase query; the index must store positions.
message PhraseQuery {
  // Phrase terms in order.
  string terms = 1;
  // Column to search; may be omitted when the enclosing TextQuery sets columns.
  optional string column = 2;
  // Maximum number of intervening unmatched positions allowed (default 0).
  uint32 slop = 3;
}

// Boost query: hits of `negative` have their scores multiplied by `negative_boost`.
message BoostQuery {
  // Query whose hits keep full score.
  FtsQuery positive = 1;
  // Query whose hits are down-weighted.
  FtsQuery negative = 2;
  // Multiplier applied to negative hits (default 0.5).
  optional float negative_boost = 3;
}

// Multi-column terms query with optional per-column boosts.
message MultiMatchQuery {
  // Query terms.
  string terms = 1;
  // Columns to search; must be non-empty.
  repeated string columns = 2;
  // Per-column boosts; when present its length must equal columns.
  repeated float boosts = 3;
  // How terms combine within each column.
  TextOperator operator = 4;
}

// Boolean combination of sub-queries.
message BooleanQuery {
  // Optional clauses; matching them increases the score.
  repeated FtsQuery should = 1;
  // Required clauses; every hit must match all of them.
  repeated FtsQuery must = 2;
  // Excluding clauses; hits matching any of them are dropped.
  repeated FtsQuery must_not = 3;
}

// Parameters for one full-text query, reused by TextSearch and the hybrid text leg.
message TextQuery {
  // The query: either a simple match string or a full query tree.
  oneof input {
    // Fast path: terms matched (OR semantics) over `columns` or all indexed text columns.
    string simple = 1;
    // Full typed query tree.
    FtsQuery fts = 2;
  }
  // Columns to fill into query nodes that do not name a column themselves.
  repeated string columns = 3;
  // Maximum number of hits to return. In a hybrid query, 0 inherits the fused k.
  uint32 k = 4;
  // WAND ranking factor; values above 1.0 trade recall for speed (default 1.0).
  optional float wand_factor = 5;
  // Optional typed predicate applied to the search.
  Filter filter = 6;
  // Whether the filter runs before or after the index search.
  FilterMode filter_mode = 7;
  // Columns to return; defaults to all non-vector columns.
  repeated string projection = 8;
  // Include the stable `_rowid` meta column in each returned row.
  bool with_row_id = 9;
  // Number of leading hits to skip.
  optional uint64 offset = 10;
}

// Fusion strategy for merging the hybrid legs.
message Fusion {
  // Exactly one strategy; defaults to reciprocal-rank fusion when the message is absent.
  oneof strategy {
    // Reciprocal-rank fusion.
    RrfFusion rrf = 1;
  }
}

// Reciprocal-rank fusion: each row scores sum over legs of 1 / (rrf_k + rank) with 1-based ranks.
message RrfFusion {
  // Rank-smoothing constant; must be positive (default 60).
  optional double rrf_k = 1;
}

// Request for SearchService.VectorSearch.
message VectorSearchRequest {
  // Organization whose dataset is searched.
  string org_id = 1;
  // Nearest-neighbor query parameters.
  VectorQuery query = 2;
}

// Response for SearchService.VectorSearch.
message VectorSearchResponse {
  // Hits ordered nearest-first.
  repeated VectorSearchResult results = 1;
}

// One nearest-neighbor hit.
message VectorSearchResult {
  // Projected columns of the row.
  google.protobuf.Struct row = 1;
  // Distance between the query vector and the row vector (smaller is closer).
  float distance = 2;
}

// Request for SearchService.TextSearch.
message TextSearchRequest {
  // Organization whose dataset is searched.
  string org_id = 1;
  // Full-text query parameters.
  TextQuery query = 2;
}

// Response for SearchService.TextSearch.
message TextSearchResponse {
  // Hits ordered best-first.
  repeated TextSearchResult results = 1;
}

// One full-text hit.
message TextSearchResult {
  // Projected columns of the row.
  google.protobuf.Struct row = 1;
  // BM25 relevance score (larger is better).
  float score = 2;
}

// Request for SearchService.HybridSearch.
message HybridSearchRequest {
  // Organization whose dataset is searched.
  string org_id = 1;
  // Vector leg parameters.
  VectorQuery vector = 2;
  // Text leg parameters.
  TextQuery text = 3;
  // Number of fused results to return.
  uint32 k = 4;
  // Fusion strategy; defaults to reciprocal-rank fusion with rrf_k = 60.
  Fusion fusion = 5;
}

// Response for SearchService.HybridSearch.
message HybridSearchResponse {
  // Fused hits ordered best-first.
  repeated HybridSearchResult results = 1;
}

// One fused hit.
message HybridSearchResult {
  // Union of the projected columns returned by the legs that contained the row.
  google.protobuf.Struct row = 1;
  // Fused score under the configured strategy (larger is better).
  double fused_score = 2;
}

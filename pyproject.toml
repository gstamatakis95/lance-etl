[project]
name = "lance-etl"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pylance>=8.0.0",
    "pyarrow>=23",
    "pyspark>=4.1",
    "pandas>=2.2.0",
    "numpy",
    "datadog",
    "ddtrace",
]

[project.scripts]
lance-etl-etl = "lance_etl.etl.cli:main"
lance-etl-index = "lance_etl.indexing.cli:main"
lance-etl-maintenance = "lance_etl.maintenance.cli:main"
lance-etl-pipeline = "lance_etl.pipeline.cli:main"
lance-etl-tools = "lance_etl.tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lance_etl"]

[dependency-groups]
dev = ["pytest", "ruff"]
bench = ["matplotlib", "grpcio", "grpcio-tools", "opentelemetry-proto"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["bench/workspace*", "bench/corpora/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ARG", "PLC0415", "D", "ANN", "C901"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C901"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow end-to-end tests that run Spark in local mode",
]

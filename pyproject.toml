[project]
name = "lance-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pylance>=8.0.0b6",
    "pyarrow>=23",
    "pyspark>=3.5",
    "datadog",
    "ddtrace",
]

[project.scripts]
lance-etl = "lance_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lance_etl"]

[dependency-groups]
dev = ["pytest", "ruff"]
bench = ["numpy", "pandas", "matplotlib", "grpcio", "grpcio-tools"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ARG", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow end-to-end tests that run Spark in local mode",
]
